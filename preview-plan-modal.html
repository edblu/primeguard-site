<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Plan signup modal — Daylight preview</title>
<style>
  :root{
    --bg:#faf8f1;
    --gold:#c9a24b;
    --gold-bright:#a87e14;
    --gold-deep:#8a6d2a;
    --ink:#101c26;
    --ink-2:#17222b;
    --teal:#0e7c86;
    --glass-shadow:0 18px 50px rgba(60,50,20,.18), 0 4px 14px rgba(60,50,20,.08);
    --gold-grad:linear-gradient(180deg,#ffd968,#d9ab2b);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ background:#efece1; }
  body{
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink-2);
    min-height:100vh;
    /* Cream Daylight canvas, presented as the dimmed/blurred page behind an open modal */
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
      linear-gradient(180deg,#faf8f1,#f3f0e6 55%,#efece1);
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
    position:relative;
  }
  /* Dim + blur veil so the page reads as "behind a modal" */
  body::before{
    content:""; position:fixed; inset:0;
    background:rgba(250,248,241,.38);
    backdrop-filter:blur(3px) saturate(1.05);
    -webkit-backdrop-filter:blur(3px) saturate(1.05);
    pointer-events:none;
  }

  /* ---------- Modal card ---------- */
  .pm-modal{
    position:relative;
    width:100%; max-width:520px;
    background:linear-gradient(165deg, rgba(255,255,255,.97), rgba(250,248,241,.94));
    border:1px solid rgba(201,162,75,.35);
    border-radius:24px;
    box-shadow:var(--glass-shadow);
    overflow:hidden; /* clips the photo band to the card radius — nothing else is clipped */
  }

  /* ---------- Photo band header ---------- */
  .pm-photo{
    position:relative;
    height:120px;
    background:url("assets/hero-plans-daylight.jpg") center 42%/cover no-repeat;
  }
  .pm-photo::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(16,28,38,.10) 0%, rgba(16,28,38,0) 55%, rgba(16,28,38,.12) 100%);
  }
  .pm-pill{
    position:absolute; top:14px; left:16px; z-index:2;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.7);
    color:var(--teal);
    font-size:.68rem; font-weight:800; letter-spacing:.14em;
    padding:7px 12px; border-radius:999px;
    box-shadow:0 4px 12px rgba(16,28,38,.14);
  }
  .pm-close{
    position:absolute; top:12px; right:14px; z-index:2;
    width:36px; height:36px; border-radius:50%;
    background:#fff; border:1px solid rgba(16,28,38,.08);
    color:var(--ink); font-size:1.05rem; line-height:1; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(16,28,38,.18);
    cursor:pointer;
  }

  /* ---------- Body ---------- */
  .pm-body{ padding:22px 24px 26px; }

  .pm-title{
    font-family:"Sora","Inter",sans-serif;
    color:var(--ink);
    font-size:1.55rem; font-weight:700; letter-spacing:-.01em;
    line-height:1.2;
  }

  /* Price row — everything lives on white, in normal flow, nothing can clip it */
  .pm-price-row{
    display:flex; align-items:center; flex-wrap:wrap; gap:10px 12px;
    margin-top:10px;
  }
  .pm-price{
    font-family:"Sora","Inter",sans-serif;
    color:var(--ink);
    font-size:2.5rem; font-weight:800; line-height:1.1; letter-spacing:-.02em;
  }
  .pm-was{
    color:#8b93a0; font-size:1.15rem; font-weight:600;
    text-decoration:line-through; text-decoration-thickness:2px;
  }
  .pm-save-chip{
    background:var(--gold-grad);
    color:#171205;
    font-size:.8rem; font-weight:800;
    padding:6px 12px; border-radius:999px;
    box-shadow:0 4px 10px rgba(217,171,43,.35);
    white-space:nowrap;
  }
  .pm-per{
    margin-top:6px;
    color:#6b7480; font-size:.9rem; font-weight:500;
  }

  /* ---------- Included list ---------- */
  .pm-included-label{
    margin-top:22px;
    color:var(--teal);
    font-size:.72rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  }
  .pm-list{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .pm-item{
    display:flex; align-items:center; gap:12px;
    background:#faf6ea;
    border:1px solid rgba(201,162,75,.28);
    border-radius:14px;
    padding:11px 14px;
    font-size:.95rem; font-weight:600; color:var(--ink-2);
  }
  /* Check circle is a flex child INSIDE the row's padding — it can never overlap text */
  .pm-check{
    flex:0 0 24px; width:24px; height:24px; border-radius:50%;
    background:var(--gold-grad);
    color:#171205;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(217,171,43,.4);
  }
  .pm-check svg{ width:13px; height:13px; display:block; }

  /* ---------- Form ---------- */
  .pm-form{ margin-top:22px; display:flex; flex-direction:column; gap:14px; }
  .pm-field label{
    display:block; margin-bottom:6px;
    font-size:.82rem; font-weight:700; color:var(--ink);
  }
  .pm-field input{
    width:100%;
    padding:13px 14px;
    font-size:1rem; color:var(--ink);
    background:#fff;
    border:1.5px solid rgba(16,28,38,.16);
    border-radius:12px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .pm-field input::placeholder{ color:#9aa3ad; }
  .pm-field input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(217,171,43,.22);
  }
  .pm-submit{
    margin-top:4px;
    width:100%;
    padding:15px 18px;
    background:var(--gold-grad);
    color:#171205;
    font-size:1.05rem; font-weight:800;
    border:none; border-radius:14px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(217,171,43,.35);
  }
  .pm-note{
    margin-top:12px; text-align:center;
    color:#7a828d; font-size:.82rem; line-height:1.45;
  }

  /* ---------- Small screens (360px) ---------- */
  @media (max-width:400px){
    body{ padding:16px 10px; }
    .pm-body{ padding:18px 16px 22px; }
    .pm-title{ font-size:1.35rem; }
    .pm-price{ font-size:2.1rem; }
    .pm-photo{ height:104px; }
    .pm-item{ font-size:.9rem; padding:10px 12px; }
  }
</style>
</head>
<body>

  <div class="pm-modal" role="dialog" aria-modal="true" aria-label="Lawn Care Plan signup">

    <!-- Photo band header -->
    <div class="pm-photo">
      <span class="pm-pill">YOU'RE ONE STEP AWAY</span>
      <button class="pm-close" type="button" aria-label="Close">&times;</button>
    </div>

    <div class="pm-body">
      <!-- Title + price -->
      <h2 class="pm-title">Lawn Care Plan</h2>
      <div class="pm-price-row">
        <span class="pm-price">$80/mo</span>
        <span class="pm-was">$90</span>
        <span class="pm-save-chip">You save $10/mo</span>
      </div>
      <p class="pm-per">$40 per visit &middot; billed monthly</p>

      <!-- Included -->
      <p class="pm-included-label">What's included:</p>
      <div class="pm-list">
        <div class="pm-item">
          <span class="pm-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
          <span>Mowing &amp; edging every two weeks</span>
        </div>
        <div class="pm-item">
          <span class="pm-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
          <span>Cleanup &amp; clippings removal</span>
        </div>
        <div class="pm-item">
          <span class="pm-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
          <span>Year-round scheduling</span>
        </div>
        <div class="pm-item">
          <span class="pm-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
          <span>Cancel anytime</span>
        </div>
      </div>

      <!-- Form -->
      <form class="pm-form" onsubmit="return false;">
        <div class="pm-field">
          <label for="pm-name">Full name</label>
          <input id="pm-name" type="text" placeholder="Your name" autocomplete="name">
        </div>
        <div class="pm-field">
          <label for="pm-phone">Phone</label>
          <input id="pm-phone" type="tel" placeholder="(305) 555-0123" autocomplete="tel">
        </div>
        <div class="pm-field">
          <label for="pm-email">Email</label>
          <input id="pm-email" type="email" placeholder="you@email.com" autocomplete="email">
        </div>
        <button class="pm-submit" type="submit">Sign me up</button>
      </form>
      <p class="pm-note">No payment due today. We confirm your start date first.</p>
    </div>

  </div>

</body>
</html>
