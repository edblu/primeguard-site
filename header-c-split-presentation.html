<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header C · Split Presentation — Vendor Portal</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #e9e2cf, #ddd3ba);
    min-height: 100vh; padding: 26px 12px 40px;
    color: #221a05;
  }
  .phone {
    max-width: 420px; margin: 0 auto;
    background: linear-gradient(180deg, #fbf3da, #f6ecd2);
    border-radius: 28px; padding: 18px 16px 30px;
    box-shadow: 0 30px 70px rgba(60,45,5,.28);
  }

  /* ===== CONCEPT C — SPLIT PRESENTATION CARD ===== */
  .split {
    position: relative; display: flex; height: 192px;
    background: rgba(255,255,255,.94); border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: 0 18px 44px rgba(120,90,10,.16);
  }
  .split-left {
    flex: 0 0 58%; min-width: 0;
    padding: 18px 12px 16px 20px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .split-logo { height: 27px; width: auto; align-self: flex-start; margin-bottom: 9px; }
  .kicker {
    font-size: .66rem; font-weight: 800; letter-spacing: .24em; text-transform: uppercase;
    color: #8a6d2a; margin-bottom: 4px;
  }
  .split-left h1 {
    font-size: clamp(1.72rem, 7.6vw, 1.98rem); font-weight: 800;
    letter-spacing: -.01em; line-height: 1.05; color: #221a05; white-space: nowrap;
  }
  .split-biz { margin-top: 6px; font-size: .98rem; font-weight: 700; color: #8a6d2a; }
  .split-meta { margin-top: 3px; font-size: .84rem; font-weight: 600; color: #7a6c48; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; align-self: flex-start;
    background: linear-gradient(120deg, #ffdf7e, #f5c542 55%, #e0aa26);
    color: #221a05; font-size: .76rem; font-weight: 800;
    padding: 6px 12px; border-radius: 999px;
    box-shadow: 0 8px 18px rgba(185,138,29,.30);
  }
  .split-photo {
    position: relative; flex: 1 1 auto; min-width: 0;
    background: url("https://primeguardmia.com/assets/hero-lawn-daylight.jpg") center / cover no-repeat;
  }
  .split-photo::after {
    content: ""; position: absolute; inset: 9px;
    border: 1.5px solid rgba(245,197,66,.75); border-radius: 14px; pointer-events: none;
  }
  .seam-badge {
    position: absolute; z-index: 5; left: 58%; top: 50%;
    transform: translate(-50%, -50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: #fff; border: 2px solid #f5c542;
    box-shadow: 0 10px 24px rgba(120,90,10,.28);
    display: flex; align-items: center; justify-content: center;
  }
  .seam-badge img { height: 29px; width: auto; display: block; }

  /* ===== shared context below (existing portal pieces) ===== */
  .money { display: flex; gap: 10px; margin-top: 14px; }
  .tile {
    flex: 1 1 0; min-width: 0; border-radius: 18px; padding: 14px 16px;
    background: linear-gradient(120deg, #ffdf7e, #f5c542 55%, #e0aa26);
    border: 1px solid rgba(255,255,255,.5);
    box-shadow: 0 12px 26px rgba(185,138,29,.28);
  }
  .tile.plain { background: rgba(255,255,255,.92); box-shadow: 0 10px 24px rgba(120,90,10,.10); }
  .tile small { display: block; font-size: .78rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #6d5c26; }
  .tile.plain small { color: #7a6c48; }
  .tile strong { display: block; font-size: 2rem; font-weight: 800; line-height: 1.1; margin-top: 2px; color: #221a05; }

  /* ===== APP PROMO C — app-store row ===== */
  .promo {
    margin-top: 14px; background: #fff; border-radius: 18px;
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: 0 14px 34px rgba(185,138,29,.20);
    display: flex; align-items: center; gap: 13px; padding: 14px 14px;
  }
  .promo-icon { width: 54px; height: 54px; border-radius: 14px; flex: none; display: block; box-shadow: 0 6px 16px rgba(120,90,10,.22); }
  .promo-txt { flex: 1 1 auto; min-width: 0; }
  .promo-txt strong { display: block; font-size: 1rem; font-weight: 800; color: #221a05; line-height: 1.2; }
  .promo-txt span { display: block; font-size: .82rem; font-weight: 600; color: #7a6c48; margin-top: 2px; }
  .promo-btn {
    flex: none; min-height: 52px; padding: 0 17px;
    display: inline-flex; align-items: center; gap: 7px;
    border: 2px solid #b98a1d; border-radius: 999px;
    background: rgba(245,197,66,.10); color: #8a6d2a;
    font-size: .92rem; font-weight: 800; white-space: nowrap;
  }
  .promo-btn svg { flex: none; }

  .sect { margin: 24px 2px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sect h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em; color: #221a05; }
  .sect .cnt { font-size: .9rem; font-weight: 700; color: #8a6d2a; white-space: nowrap; }
</style>
</head>
<body>
  <div class="phone">

    <!-- CONCEPT C — Split Presentation -->
    <div class="split">
      <div class="split-left">
        <img class="split-logo" src="https://primeguardmia.com/assets/logo-transparent.png" alt="PrimeGuard">
        <div class="kicker">Portal de Vendedores</div>
        <h1>Hola, Ángel</h1>
        <div class="split-biz">Naturascape LLC</div>
        <div class="split-meta">Kendall · Viernes 16 de octubre</div>
        <span class="pill">✓ Aprobado</span>
      </div>
      <div class="split-photo"></div>
      <div class="seam-badge"><img src="https://primeguardmia.com/assets/logo-transparent.png" alt="PG"></div>
    </div>

    <!-- context: existing money strip -->
    <div class="money">
      <div class="tile"><small>Por cobrar</small><strong>$45</strong></div>
      <div class="tile plain"><small>Este mes</small><strong>$180</strong></div>
    </div>

    <!-- APP PROMO C — app-store row -->
    <div class="promo">
      <img class="promo-icon" src="https://primeguardmia.com/assets/icon-192.png" alt="PrimeGuard app">
      <div class="promo-txt">
        <strong>PrimeGuard Vendor</strong>
        <span>App oficial · Avisos al instante</span>
      </div>
      <span class="promo-btn">Instalar
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0-4.5-4.5M12 14l4.5-4.5M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>

    <!-- context: next section heading -->
    <div class="sect"><h2>Tu próximo trabajo</h2><span class="cnt">1 en curso</span></div>

  </div>
</body>
</html>
