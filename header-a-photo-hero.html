<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header A · Photo Hero — Vendor Portal</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #e9e2cf, #ddd3ba);
    min-height: 100vh; padding: 26px 12px 40px;
    color: #221a05;
  }
  .phone {
    max-width: 420px; margin: 0 auto;
    background: linear-gradient(180deg, #fbf3da, #f6ecd2);
    border-radius: 28px; padding: 18px 16px 30px;
    box-shadow: 0 30px 70px rgba(60,45,5,.28);
  }

  /* ===== CONCEPT A — PHOTO HERO CARD ===== */
  .hero {
    position: relative; height: 232px; border-radius: 22px; overflow: hidden;
    background: url("https://primeguardmia.com/assets/careers-crew.jpg") center 30% / cover no-repeat;
    box-shadow: 0 18px 44px rgba(120,90,10,.16);
    border: 1px solid rgba(255,255,255,.5);
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,14,2,.05) 34%, rgba(20,14,2,.52) 66%, rgba(20,14,2,.86));
  }
  /* gold corner brackets (Daylight hero style) */
  .br { position: absolute; width: 26px; height: 26px; z-index: 3; pointer-events: none; }
  .br.tl { top: 12px; left: 12px;  border-top: 3px solid #f5c542; border-left: 3px solid #f5c542;  border-top-left-radius: 9px; }
  .br.tr { top: 12px; right: 12px; border-top: 3px solid #f5c542; border-right: 3px solid #f5c542; border-top-right-radius: 9px; }
  .br.bl { bottom: 12px; left: 12px;  border-bottom: 3px solid #f5c542; border-left: 3px solid #f5c542;  border-bottom-left-radius: 9px; }
  .br.br2 { bottom: 12px; right: 12px; border-bottom: 3px solid #f5c542; border-right: 3px solid #f5c542; border-bottom-right-radius: 9px; }

  .logo-chip {
    position: absolute; top: 20px; left: 20px; z-index: 4;
    background: rgba(255,255,255,.14);
    -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
    border: 1px solid rgba(255,255,255,.38); border-radius: 12px;
    padding: 7px 11px; display: flex; align-items: center;
    box-shadow: 0 6px 18px rgba(20,14,2,.25);
  }
  .logo-chip img { height: 26px; width: auto; display: block; }

  .hero-body { position: absolute; left: 20px; right: 20px; bottom: 17px; z-index: 4; }
  .kicker {
    font-size: .7rem; font-weight: 800; letter-spacing: .24em; text-transform: uppercase;
    color: #ffd968; margin-bottom: 6px; text-shadow: 0 1px 8px rgba(20,14,2,.5);
  }
  .hero-body h1 {
    font-size: 2.15rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.05;
    color: #fff; text-shadow: 0 2px 14px rgba(20,14,2,.45);
  }
  .hero-sub {
    margin-top: 6px; font-size: .96rem; font-weight: 600;
    color: rgba(255,248,230,.95); text-shadow: 0 1px 8px rgba(20,14,2,.55);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 11px;
    background: linear-gradient(120deg, #ffdf7e, #f5c542 55%, #e0aa26);
    color: #221a05; font-size: .78rem; font-weight: 800;
    padding: 6px 13px; border-radius: 999px;
    box-shadow: 0 8px 20px rgba(20,14,2,.35);
  }

  /* ===== shared context below (existing portal pieces) ===== */
  .money { display: flex; gap: 10px; margin-top: 14px; }
  .tile {
    flex: 1 1 0; min-width: 0; border-radius: 18px; padding: 14px 16px;
    background: linear-gradient(120deg, #ffdf7e, #f5c542 55%, #e0aa26);
    border: 1px solid rgba(255,255,255,.5);
    box-shadow: 0 12px 26px rgba(185,138,29,.28);
  }
  .tile.plain { background: rgba(255,255,255,.92); box-shadow: 0 10px 24px rgba(120,90,10,.10); }
  .tile small { display: block; font-size: .78rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #6d5c26; }
  .tile.plain small { color: #7a6c48; }
  .tile strong { display: block; font-size: 2rem; font-weight: 800; line-height: 1.1; margin-top: 2px; color: #221a05; }

  /* ===== APP PROMO A — gold gradient banner ===== */
  .promo {
    margin-top: 14px; border-radius: 18px; padding: 16px;
    background: linear-gradient(120deg, #ffdf7e, #f5c542 55%, #e0aa26);
    border: 1px solid rgba(255,255,255,.5);
    box-shadow: 0 14px 32px rgba(185,138,29,.32);
  }
  .promo-row { display: flex; align-items: center; gap: 13px; }
  .promo-ico {
    flex: none; width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,.38);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.65);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 18px rgba(120,90,10,.25);
  }
  .promo-ico img { width: 40px; height: 40px; border-radius: 11px; display: block; }
  .promo-txt { flex: 1 1 auto; min-width: 0; }
  .promo-txt strong { display: block; font-size: 1.06rem; font-weight: 800; color: #221a05; line-height: 1.2; }
  .promo-txt span { display: block; font-size: .86rem; font-weight: 600; color: rgba(34,26,5,.78); margin-top: 2px; line-height: 1.35; }
  .promo-btn {
    margin-top: 14px; min-height: 52px; border-radius: 999px;
    background: #221a05; color: #ffe9a8;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-size: .98rem; font-weight: 800; letter-spacing: .01em;
    box-shadow: 0 12px 26px rgba(34,26,5,.35);
  }

  .sect { margin: 24px 2px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sect h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em; color: #221a05; }
  .sect .cnt { font-size: .9rem; font-weight: 700; color: #8a6d2a; white-space: nowrap; }
</style>
</head>
<body>
  <div class="phone">

    <!-- CONCEPT A — Photo Hero Card -->
    <div class="hero">
      <span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br br2"></span>
      <div class="logo-chip"><img src="https://primeguardmia.com/assets/logo-transparent.png" alt="PrimeGuard"></div>
      <div class="hero-body">
        <div class="kicker">Portal de Vendedores</div>
        <h1>Hola, Ángel</h1>
        <div class="hero-sub">Naturascape LLC · Kendall</div>
        <span class="pill">✓ Aprobado</span>
      </div>
    </div>

    <!-- context: existing money strip -->
    <div class="money">
      <div class="tile"><small>Por cobrar</small><strong>$45</strong></div>
      <div class="tile plain"><small>Este mes</small><strong>$180</strong></div>
    </div>

    <!-- APP PROMO A — gold gradient banner -->
    <div class="promo">
      <div class="promo-row">
        <div class="promo-ico"><img src="https://primeguardmia.com/assets/icon-192.png" alt="PrimeGuard app"></div>
        <div class="promo-txt">
          <strong>Tu app de PrimeGuard</strong>
          <span>Los trabajos nuevos te llegan al teléfono al instante.</span>
        </div>
      </div>
      <div class="promo-btn">Instalar la app
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0-4.5-4.5M12 14l4.5-4.5M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- context: next section heading -->
    <div class="sect"><h2>Tu próximo trabajo</h2><span class="cnt">1 en curso</span></div>

  </div>
</body>
</html>
