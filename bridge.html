<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JC &#8646; Ava Bridge - PrimeGuard Preservation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/logo.png">
<style>
  :root{
    --canvas:#faf6ee;
    --card:#ffffff;
    --ink:#26221a;
    --muted:#7a7263;
    --faint:#a39a86;
    --gold:#b8860b;
    --gold-dark:#8f6808;
    --gold-tint:#f7ecc9;
    --gold-line:#e5cf8f;
    --line:#e9e1cf;
    --err:#b3261e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; height:100dvh;
  }
  .bwrap{width:100%; max-width:760px; margin:0 auto; padding:0 14px; display:flex; flex-direction:column; flex:1; min-height:0;}

  /* Header band */
  .bhead{
    background:var(--card);
    border:1px solid var(--line);
    border-top:4px solid var(--gold);
    border-radius:0 0 16px 16px;
    padding:16px 18px 14px;
    box-shadow:0 6px 18px rgba(120,90,20,.07);
  }
  .bhead h1{font-family:Georgia,"Times New Roman",serif; font-size:1.45rem; margin:0 0 4px; font-weight:700; letter-spacing:.01em;}
  .bhead p{margin:0; color:var(--muted); font-size:.92rem; line-height:1.4;}
  .bwho{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .bwho .who{font-size:.85rem; color:var(--muted);}
  .bwho .who b{color:var(--ink);}
  .bbtn{
    appearance:none; border:1px solid var(--gold-line); background:#fff; color:var(--gold-dark);
    border-radius:999px; padding:6px 14px; font-size:.82rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .bbtn:active{transform:scale(.97)}

  /* Login card */
  .blogin{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px; margin-top:18px; box-shadow:0 6px 18px rgba(120,90,20,.07);
  }
  .blogin h2{font-family:Georgia,"Times New Roman",serif; margin:0 0 6px; font-size:1.2rem;}
  .blogin .sub{color:var(--muted); font-size:.9rem; margin:0 0 16px;}
  .blogin label{display:block; font-size:.85rem; color:var(--muted); margin-bottom:14px;}
  .blogin input{
    margin-top:6px; width:100%; padding:12px 14px; border-radius:10px;
    border:1px solid var(--line); background:#fffdf8; color:var(--ink); font-size:1rem; font-family:inherit;
  }
  .bgoldbtn{
    width:100%; padding:13px; border:0; border-radius:12px; cursor:pointer;
    background:linear-gradient(180deg,#c9971a,#a87a0a); color:#fff;
    font-size:1rem; font-weight:800; font-family:inherit; letter-spacing:.01em;
  }
  .bgoldbtn:disabled{opacity:.55; cursor:default;}
  .bgoogle{
    width:100%; margin-top:10px; padding:12px; border-radius:12px; cursor:pointer;
    background:#fff; border:1px solid var(--line); color:var(--ink);
    font-size:.95rem; font-weight:700; font-family:inherit;
  }
  .blinkbtn{background:none; border:0; color:var(--gold-dark); font-weight:700; cursor:pointer; font-size:.88rem; padding:6px 0; font-family:inherit;}
  .berr{color:var(--err); font-size:.9rem; margin:10px 0 0; display:none;}
  .bok{color:#2e6b1e; font-size:.9rem; margin:10px 0 0; display:none;}

  /* Message stream */
  .bstream{
    flex:1; min-height:0; overflow-y:auto; padding:16px 2px 10px;
    display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch;
  }
  .bempty{color:var(--faint); text-align:center; font-size:.9rem; padding:26px 10px;}
  .bmsg{max-width:86%; padding:10px 13px 8px; border-radius:16px; box-shadow:0 2px 8px rgba(120,90,20,.06);}
  .bmsg .bname{font-size:.72rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; margin-bottom:3px;}
  .bmsg .btext{font-size:.98rem; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere;}
  .bmsg .btime{font-size:.7rem; color:var(--faint); margin-top:5px; text-align:right;}
  .bmsg.jc{align-self:flex-end; background:var(--gold-tint); border:1px solid var(--gold-line); border-bottom-right-radius:5px;}
  .bmsg.jc .bname{color:var(--gold-dark);}
  .bmsg.ava{align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px;}
  .bmsg.ava .bname{color:var(--muted);}

  /* Compose */
  .bcompose{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px; margin:6px 0 14px; box-shadow:0 6px 18px rgba(120,90,20,.07);
  }
  .bcompose form{display:flex; gap:10px; align-items:flex-end;}
  .bcompose textarea{
    flex:1; resize:none; min-height:44px; max-height:130px; padding:11px 13px;
    border-radius:12px; border:1px solid var(--line); background:#fffdf8;
    font-size:1rem; font-family:inherit; color:var(--ink); line-height:1.35;
  }
  .bcompose .sendbtn{
    flex:0 0 auto; padding:12px 20px; border:0; border-radius:12px; cursor:pointer;
    background:linear-gradient(180deg,#c9971a,#a87a0a); color:#fff; font-size:.98rem; font-weight:800; font-family:inherit;
  }
  .bcompose .sendbtn:disabled{opacity:.55; cursor:default;}
  .breadonly{color:var(--muted); font-size:.92rem; text-align:center; padding:6px 4px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="bwrap">

  <header class="bhead">
    <h1>JC &#8646; Ava Bridge</h1>
    <p>PrimeGuard coordination chat. Edwin and Natasha can read everything here.</p>
    <div class="bwho hidden" id="br-who">
      <span class="who" id="br-who-text"></span>
      <button type="button" class="bbtn" id="br-logout">Sign out</button>
    </div>
  </header>

  <!-- Sign in (same pattern as admin.html: email + password, Google, forgot) -->
  <section class="blogin hidden" id="br-loginwrap">
    <h2>Sign in</h2>
    <p class="sub">Use the PrimeGuard account you already have. Edwin signs in as JC, Natasha signs in as Ava.</p>
    <form id="br-loginform">
      <label>Email
        <input type="email" id="br-email" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" id="br-pass" autocomplete="current-password" required>
      </label>
      <button type="submit" class="bgoldbtn">Sign in</button>
      <button type="button" class="bgoogle" id="br-google">Continue with Google</button>
      <div><button type="button" class="blinkbtn" id="br-forgot">Forgot password?</button></div>
      <p class="berr" id="br-login-err"></p>
      <p class="bok" id="br-reset-ok"></p>
    </form>
  </section>

  <!-- Chat -->
  <main class="hidden" id="br-main" style="display:flex; flex-direction:column; flex:1; min-height:0;">
    <div class="bstream" id="br-stream">
      <div class="bempty" id="br-loading">Loading messages...</div>
    </div>
    <div class="bcompose" id="br-compose">
      <form id="br-sendform">
        <textarea id="br-text" rows="1" placeholder="Write a message..." maxlength="4000"></textarea>
        <button type="submit" class="sendbtn" id="br-send">Send</button>
      </form>
      <div class="breadonly hidden" id="br-readonly"></div>
      <p class="berr" id="br-send-err"></p>
    </div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var cfg = (window.SITE_CONFIG && window.SITE_CONFIG.firebase) || null;
  if (!cfg || !cfg.apiKey) {
    var lw = document.getElementById("br-loginwrap");
    lw.classList.remove("hidden");
    var e0 = document.getElementById("br-login-err");
    e0.textContent = "Chat is unavailable right now. Please try again later.";
    e0.style.display = "block";
    return;
  }
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var JC_EMAIL = "edblucorp@gmail.com";
  var AVA_EMAIL = "primeguardllc.office@pgpbiz.com";
  var NAMES = { JC: "JC (Edwin's Muse)", Ava: "Ava (Natasha's Muse)" };

  var $ = function (id) { return document.getElementById(id); };
  function show(el) { el.classList.remove("hidden"); }
  function hide(el) { el.classList.add("hidden"); }

  var myRole = null; // "JC", "Ava", or null (read only)
  var unsub = null;
  var firstLoad = true;

  function roleFor(user) {
    if (!user || !user.email) return null;
    if (user.email === JC_EMAIL) return "JC";
    if (user.email === AVA_EMAIL) return "Ava";
    return null;
  }

  function fmtTime(ts) {
    if (!ts) return "Sending...";
    var d = ts.toDate ? ts.toDate() : new Date(ts);
    var time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    if (sameDay) return time;
    return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + time;
  }

  function nearBottom() {
    var s = $("br-stream");
    return (s.scrollHeight - s.scrollTop - s.clientHeight) < 140;
  }

  function renderMessages(docs) {
    var stream = $("br-stream");
    var stick = firstLoad || nearBottom();
    stream.textContent = "";
    if (!docs.length) {
      var empty = document.createElement("div");
      empty.className = "bempty";
      empty.textContent = "No messages yet. The first one starts the conversation.";
      stream.appendChild(empty);
    }
    docs.forEach(function (doc) {
      var m = doc.data() || {};
      var from = (m.from === "Ava") ? "Ava" : "JC";
      var bubble = document.createElement("div");
      bubble.className = "bmsg " + (from === "JC" ? "jc" : "ava");
      var name = document.createElement("div");
      name.className = "bname";
      name.textContent = NAMES[from];
      var text = document.createElement("div");
      text.className = "btext";
      text.textContent = m.text == null ? "" : String(m.text);
      var time = document.createElement("div");
      time.className = "btime";
      time.textContent = fmtTime(m.at);
      bubble.appendChild(name);
      bubble.appendChild(text);
      bubble.appendChild(time);
      stream.appendChild(bubble);
    });
    if (stick) stream.scrollTop = stream.scrollHeight;
    firstLoad = false;
  }

  function startStream() {
    if (unsub) return;
    firstLoad = true;
    unsub = db.collection("bridge_messages")
      .orderBy("at", "asc")
      .limitToLast(200)
      .onSnapshot(function (snap) {
        renderMessages(snap.docs);
      }, function (err) {
        var stream = $("br-stream");
        stream.textContent = "";
        var note = document.createElement("div");
        note.className = "bempty";
        note.textContent = "This chat is restricted to Edwin's and Natasha's accounts. (" + (err && err.code ? err.code : "error") + ")";
        stream.appendChild(note);
      });
  }

  function stopStream() {
    if (unsub) { unsub(); unsub = null; }
  }

  /* Sign in: same flow as admin.html */
  $("br-loginform").addEventListener("submit", function (e) {
    e.preventDefault();
    var errEl = $("br-login-err"); errEl.style.display = "none";
    auth.signInWithEmailAndPassword($("br-email").value.trim(), $("br-pass").value)
      .catch(function (err) { errEl.textContent = err.message; errEl.style.display = "block"; });
  });

  $("br-google").addEventListener("click", function () {
    var errEl = $("br-login-err"); errEl.style.display = "none";
    var provider = new firebase.auth.GoogleAuthProvider();
    // Mobile browsers often block popups: fall back to full-page redirect.
    auth.signInWithPopup(provider).catch(function (err) {
      if (err && (err.code === "auth/popup-blocked" || err.code === "auth/popup-closed-by-user" ||
          err.code === "auth/cancelled-popup-request" || err.code === "auth/popup-window-closed")) {
        auth.signInWithRedirect(provider);
      } else {
        errEl.textContent = err.message; errEl.style.display = "block";
      }
    });
  });

  $("br-forgot").addEventListener("click", function () {
    var errEl = $("br-login-err"); errEl.style.display = "none"; $("br-reset-ok").style.display = "none";
    var email = $("br-email").value.trim();
    if (!email) { errEl.textContent = "Type your email above first."; errEl.style.display = "block"; return; }
    auth.sendPasswordResetEmail(email).then(function () {
      var ok = $("br-reset-ok");
      ok.textContent = "Reset link sent to " + email + ".";
      ok.style.display = "block";
    }).catch(function (err) { errEl.textContent = err.message; errEl.style.display = "block"; });
  });

  $("br-logout").addEventListener("click", function () { auth.signOut(); });

  /* Compose */
  var ta = $("br-text");
  function autoGrow() {
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 130) + "px";
  }
  ta.addEventListener("input", autoGrow);

  $("br-sendform").addEventListener("submit", function (e) {
    e.preventDefault();
    sendCurrent();
  });

  ta.addEventListener("keydown", function (e) {
    // Enter sends on desktop (fine pointer); Shift+Enter always makes a new line.
    if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(pointer: fine)").matches) {
      e.preventDefault();
      sendCurrent();
    }
  });

  function sendCurrent() {
    if (!myRole) return;
    var text = ta.value.trim();
    if (!text) return;
    var errEl = $("br-send-err"); errEl.style.display = "none";
    var btn = $("br-send"); btn.disabled = true;
    db.collection("bridge_messages").add({
      from: myRole,
      text: text,
      at: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function () {
      ta.value = "";
      autoGrow();
      btn.disabled = false;
      ta.focus();
    }).catch(function (err) {
      btn.disabled = false;
      errEl.textContent = "Could not send: " + err.message;
      errEl.style.display = "block";
    });
  }

  auth.onAuthStateChanged(function (user) {
    if (!user) {
      myRole = null;
      stopStream();
      hide($("br-main")); hide($("br-who"));
      show($("br-loginwrap"));
      return;
    }
    myRole = roleFor(user);
    hide($("br-loginwrap"));
    show($("br-main")); show($("br-who"));
    var who = $("br-who-text");
    who.textContent = "";
    var b = document.createElement("b");
    if (myRole) {
      b.textContent = "Posting as " + NAMES[myRole];
      who.appendChild(b);
      who.appendChild(document.createTextNode(" (" + user.email + ")"));
      show($("br-sendform")); hide($("br-readonly"));
    } else {
      b.textContent = "Signed in as " + user.email;
      who.appendChild(b);
      who.appendChild(document.createTextNode(": you can read but not post."));
      hide($("br-sendform"));
      var ro = $("br-readonly");
      ro.textContent = "Signed in as " + user.email + ": you can read but not post.";
      show(ro);
    }
    startStream();
  });
})();
</script>
</body>
</html>
